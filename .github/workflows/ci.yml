name: MVP contracts and integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix services/api
      - run: npm ci --prefix apps/web
      - run: python -m pip install -r requirements-nat-lock.txt
      - run: python -m pip install -e '.[nat]'
      - run: python -m pytest -q
      - run: node --test services/api/access.test.mjs
      - run: npm run build --prefix apps/web
