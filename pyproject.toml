[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "handoffos-orchestrator"
version = "0.1.0"
description = "Evidence-grounded, bounded onboarding orchestration"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "httpx>=0.28,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "PyYAML>=6,<7", "reportlab>=4,<5", "tokenizers>=0.21,<1"]

[project.optional-dependencies]
nat = ["nvidia-nat==1.5.0"]
# The native Orchestrator uses the official MCP Python client only when
# HANDOFF_RETRIEVAL_MODE=mcp.  Keeping it optional preserves the offline MVP.
mcp = ["mcp>=1.12,<2"]

[project.entry-points.'nat.plugins']
handoffos = "handoff.nat_workflow"

[tool.setuptools.packages.find]
where = ["services/orchestrator"]
include = ["handoff*"]
