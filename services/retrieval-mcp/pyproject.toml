[project]
name = "handoff-retrieval-mcp"
version = "0.1.0"
description = "Read-only Slack, Notion, and Google Drive retrieval MCP server."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.12,<2",
  "pydantic>=2.9,<3",
  "pypdf>=5,<7",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
nat = ["nvidia-nat[langchain,mcp]>=1.8,<2"]

[project.scripts]
retrieval-mcp = "retrieval_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_mcp"]
